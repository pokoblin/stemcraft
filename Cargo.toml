[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Pure-Rust HTDemucs (Burn). Not on crates.io, so pin a reviewed revision.
demucs-core = { git = "https://github.com/nikhilunni/demucs-rs", rev = "5d9f61a2e15987c5ea9a9fe92300b64d994bcd12", features = ["wgpu", "autotune", "fusion"] }
burn = { version = "0.20.1", features = ["wgpu", "autotune", "fusion", "metal"] }
cubecl = { version = "0.9", default-features = false }

# Model inference is unusably slow unoptimised; keep dependencies fast in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
