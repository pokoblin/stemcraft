[target.'cfg(target_os = "macos")'.dependencies]
objc2-audio-toolbox = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"

[dev-dependencies]
tempfile = "3.27.0"
